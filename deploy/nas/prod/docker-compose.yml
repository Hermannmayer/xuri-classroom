# 旭日云课堂 · NAS 生产「目标态」compose（飞牛 fnOS / ）

name: xuri-prod

services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-surveyking}
      TZ: Asia/Shanghai
    volumes:

      - ${XURI_DATA_DIR:-/vol2/1000/xuri/prod}/mysql:/var/lib/mysql


    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  app:
    image: ${XURI_APP_IMAGE:-xuri-classroom:latest}






    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-surveyking}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-surveyking}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}

      SK_CRYPTO_KEY: ${SK_CRYPTO_KEY:?请在 .env 里设置 SK_CRYPTO_KEY（Base64 的 32 字节，务必备份到密码管理器）}

      SK_JWT_SECRET: ${JWT_SECRET:-}
      TZ: Asia/Shanghai



      JAVA_OPTS: ${JAVA_OPTS:--Xmx768m}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx768m}
    expose:

      - '7007'
    volumes:

      - ${XURI_DATA_DIR:-/vol2/1000/xuri/prod}/files:/app/files


    mem_limit: 1g
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:

      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:7007/api/system >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  web:
    image: ${XURI_WEB_IMAGE:-xuri-classroom-web:latest}




    restart: unless-stopped
    ports:

      - '${APP_PORT:-201}:80'
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
