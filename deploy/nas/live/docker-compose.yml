# =============================================================================
# 旭日云课堂 · NAS「单栈 live」编排（飞牛 fnOS / 192.168.0.2）
#
# 这一份是给「学校直接在用、改完要立刻看到」的场景准备的：
#   · 只有一个环境，不存在 staging / 灰度，改完就是线上
#   · 前端：web-watch 容器常驻跑 `vite build --watch`，产物写进共享卷，
#           nginx 直接读那卷 —— 你保存 .tsx，1~2 秒后刷新页面就是新代码
#   · 后端：app 容器跑一个 bind mount 进来的 jar；改完 .java 用
#           `bash scripts/nas/live-reload.sh` 编译 + 重启（约 10~20 秒）
#   · 端口同时发布 200 和 201：你的反代打到哪个都能进，省得来回确认
#
# 为什么前端不用 Vite dev server：dev server 无压缩、无缓存、出错直接白屏，
# 学校几十人同时考试时很脆。watch 构建同样快，但产物是生产形态。
#
# 用法（在本目录）：
#   cp .env.example .env && vi .env
#   docker compose up -d
#   改前端 → 直接刷页面；改后端 → bash <仓库>/scripts/nas/live-reload.sh
# =============================================================================

name: xuri-live

services:
  # ---------------------------------------------------------------- 数据库
  db:
    image: mysql:8.0
    container_name: xuri-live-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 8GB 机器：给 512M，够学校这个量级（H2 原库只有 48MB）
      - --innodb-buffer-pool-size=384M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-surveyking}
      TZ: Asia/Shanghai
    volumes:
      # 数据落宿主机目录：飞牛的文件夹备份/快照能覆盖到
      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/mysql:/var/lib/mysql
      # 刻意不挂 init-mysql.sql：那脚本含 22 处 DROP TABLE，对着有数据的库执行就是清库。
      # 建库/迁移走 scripts/nas/ 里的受控流程。
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- 后端
  app:
    image: ${XURI_RUNTIME_IMAGE:-xuri-runtime:8}
    container_name: xuri-live-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-surveyking}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      # 关键：JDK8 的 mysql-connector 默认 useSSL=PREFERRED，跟 MySQL 8.0.46 的
      # TLS 握不上（实测 SSLHandshakeException: handshake_failure）。
      # 走 compose 内网，直接关 SSL 最省事；SPRING_DATASOURCE_URL 会覆盖
      # application-dev.yml 里的 url。
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-surveyking}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SK_CRYPTO_KEY: ${SK_CRYPTO_KEY:?请在 .env 里设置 SK_CRYPTO_KEY}
      SK_JWT_SECRET: ${JWT_SECRET:-}
      # JVM 上限：机器还要跑 MySQL、watch 构建和飞牛自己
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx768m}
      # 并发调参（2026-11-07）：默认 Hikari 10 个连接是开考瞬间的瓶颈，
      # Undertow 默认 8×核数=32 个 worker；这台 4 核机器按实测抬到 20/64。
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '20'
      SERVER_UNDERTOW_THREADS_WORKER: '64'
      TZ: Asia/Shanghai
    expose:
      - '7007'
    volumes:
      # jar 由 scripts/nas/live-reload.sh 编译后放进来；create_host_path: false
      # 是故意的：jar 不在时直接报错，而不是悄悄建个同名目录让 java 启动失败
      - type: bind
        source: ${XURI_BUILD_DIR:-/vol2/1000/xuri/live/build}/app.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/files:/app/files
    mem_limit: 1g
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- 前端入口
  web:
    image: nginx:1.27-alpine
    container_name: xuri-live-web
    restart: unless-stopped
    ports:
      # 201：Lucky 反向代理的转发目标（实测：Lucky 自己监听 200，转发到 201）。
      #     换掉旧容器后反代不用改任何配置。
      - '${APP_PORT:-201}:80'
      # 1201：直连调试口，排查问题时绕过反代直接打后端/前端
      - '${APP_EXTRA_PORT:-1201}:80'
    volumes:
      # 复用仓库里那份 nginx 配置：SPA 回落 + /api /captcha /files 反代到 app:7007
      - ../../../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # web-watch 构建出来的产物
      - web-dist:/usr/share/nginx/html:ro
    mem_limit: 128m
    depends_on:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- 前端常驻构建
  web-watch:
    image: node:20-bookworm-slim
    container_name: xuri-live-web-watch
    restart: unless-stopped
    working_dir: /web
    environment:
      TZ: Asia/Shanghai
      # 首次 npm ci 走国内镜像会快很多；想用官方源就删掉这一行
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      # vite build 这个项目要 1.2~1.5G 堆；不显式给会被 V8 按容器内存比例限死，
      # 实测 1g 上限直接 OOM（FatalProcessOutOfMemory）。
      NODE_OPTIONS: --max-old-space-size=1536
    command:
      - sh
      - -c
      - |
        LOCK_HASH=$$(md5sum package-lock.json 2>/dev/null | cut -d' ' -f1)
        if [ ! -d node_modules/vite ] || [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$LOCK_HASH" ]; then
          echo "[web-watch] 安装/更新依赖（首次约 1-3 分钟）"
          npm ci --no-audit --no-fund
          echo "$$LOCK_HASH" > node_modules/.lock-hash
        fi
        echo "[web-watch] 开始 watch 构建，保存即产物；日志里看到 built in xxx ms 就刷页面"
        npx vite build --watch --logLevel info
    volumes:
      - ${XURI_SRC:-/vol2/1000/xuri/src}/client:/web
      # 产物卷：nginx 读、这里写
      - web-dist:/web/dist
      # node_modules 放命名卷：避免 Windows 下 checkout 出来的二进制污染容器
      - node-modules:/web/node_modules
    # vite 构建这个项目实测要 1.2~1.5G 堆，1g 会被 OOM 杀掉
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- 备份
  # 为什么不挂飞牛的系统计划任务：OTA 升级会替换系统分区，/etc/cron.d 有丢失风险。
  # 放进 compose 后备份跟着容器走，升级不影响，重启自动恢复。
  backup:
    # 直接用 mysql:8.0：它自带 mysqldump / gzip / tar / sha256sum，不用自建镜像
    image: mysql:8.0
    container_name: xuri-live-backup
    entrypoint: ["/bin/sh", "-c"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-surveyking}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      BACKUP_DIR: /backup
      FILES_DIR: /data/files
      RETENTION: ${BACKUP_RETENTION:-28}
      TZ: Asia/Shanghai
    volumes:
      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/files:/data/files:ro
      - ${XURI_BACKUP_DIR:-/vol2/1000/xuri/backup}:/backup
      - ../../../scripts/nas/backup-live.sh:/opt/backup/backup-live.sh:ro
    # 每 6 小时一份；28 份 ≈ 7 天。比"每天一次"更抗意外，代价只是多占几百 MB。
    # entrypoint 已经是 /bin/sh -c，所以 command 只给一整段脚本文本。
    command:
      - |
        while true; do
          sh /opt/backup/backup-live.sh || echo "[backup] 本次失败，6 小时后重试"
          sleep 21600
        done
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  web-dist:
    name: xuri-live-web-dist
  node-modules:
    name: xuri-live-node-modules