# 旭日云课堂 · NAS「单栈 live」编排（飞牛 fnOS / ）

name: xuri-live

services:

  db:
    image: mysql:8.0
    container_name: xuri-live-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

      - --innodb-buffer-pool-size=384M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-surveyking}
      TZ: Asia/Shanghai
    volumes:

      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/mysql:/var/lib/mysql


    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  app:
    image: ${XURI_RUNTIME_IMAGE:-xuri-runtime:25}
    container_name: xuri-live-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-surveyking}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}




      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-surveyking}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SK_CRYPTO_KEY: ${SK_CRYPTO_KEY:?请在 .env 里设置 SK_CRYPTO_KEY}
      SK_JWT_SECRET: ${JWT_SECRET:-}


      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-}
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-Hermannmayer/xuri-classroom}
      UPDATE_GITHUB_API_BASE: ${UPDATE_GITHUB_API_BASE:-https://api.github.com}
      UPDATE_CHECK_INTERVAL_HOURS: ${UPDATE_CHECK_INTERVAL_HOURS:-24}
      UPDATE_APPLY_ENABLED: ${UPDATE_APPLY_ENABLED:-true}
      UPDATE_APPLY_JAR_PATH: /app/build/app.jar

      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx768m}



      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '20'
      TZ: Asia/Shanghai
    expose:
      - '7007'
    volumes:


      - type: bind
        source: ${XURI_BUILD_DIR:-/vol2/1000/xuri/live/build}/app.jar
        target: /app/app.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XURI_BUILD_DIR:-/vol2/1000/xuri/live/build}
        target: /app/build
        bind:
          create_host_path: true
      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/files:/app/files


      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/logs:/app/logs
    mem_limit: 1g
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  web:
    image: nginx:1.27-alpine
    container_name: xuri-live-web
    restart: unless-stopped
    ports:


      - '${APP_PORT:-201}:80'

      - '${APP_EXTRA_PORT:-1201}:80'
    volumes:

      - ../../../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - web-dist:/usr/share/nginx/html:ro
    mem_limit: 128m
    depends_on:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  web-watch:
    image: node:20-bookworm-slim
    container_name: xuri-live-web-watch
    restart: unless-stopped
    working_dir: /web
    environment:
      TZ: Asia/Shanghai

      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}


      NODE_OPTIONS: --max-old-space-size=1536
    command:
      - sh
      - -c
      - |



        NODE_OK=$$(node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.stdout.write((a>22||(a===22&&b>=12)||(a===20&&b>=19))?"1":"0")' 2>/dev/null)
        if [ "$$NODE_OK" != "1" ]; then
          echo "[web-watch] ❌ Node 版本不满足 Vite 8 要求（当前 $$(node -v)，需要 ^20.19 或 >=22.12）"
          echo "[web-watch] 修复：docker pull docker.m.daocloud.io/library/node:22-bookworm-slim && \\"
          echo "[web-watch]       docker tag docker.m.daocloud.io/library/node:22-bookworm-slim node:22-bookworm-slim && \\"
          echo "[web-watch]       把 docker-compose.yml 里的 web-watch image 改成 node:22-bookworm-slim 后重启本容器"
          exit 1
        fi
        LOCK_HASH=$$(md5sum package-lock.json 2>/dev/null | cut -d' ' -f1)
        if [ ! -d node_modules/vite ] || [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$LOCK_HASH" ]; then
          echo "[web-watch] 安装/更新依赖（首次约 1-3 分钟）"
          npm ci --no-audit --no-fund
          echo "$$LOCK_HASH" > node_modules/.lock-hash
        fi
        echo "[web-watch] 开始 watch 构建，保存即产物；日志里看到 built in xxx ms 就刷页面"
        npx vite build --watch --logLevel info
    volumes:
      - ${XURI_SRC:-/vol2/1000/xuri/src}/client:/web

      - web-dist:/web/dist

      - node-modules:/web/node_modules

    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'




  backup:

    image: mysql:8.0
    container_name: xuri-live-backup
    entrypoint: ["/bin/sh", "-c"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-surveyking}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      BACKUP_DIR: /backup
      FILES_DIR: /data/files
      RETENTION: ${BACKUP_RETENTION:-28}
      TZ: Asia/Shanghai
    volumes:
      - ${XURI_DATA_DIR:-/vol2/1000/xuri/live}/files:/data/files:ro
      - ${XURI_BACKUP_DIR:-/vol2/1000/xuri/backup}:/backup
      - ../../../scripts/nas/backup-live.sh:/opt/backup/backup-live.sh:ro


    command:
      - |
        while true; do
          sh /opt/backup/backup-live.sh || echo "[backup] 本次失败，6 小时后重试"
          sleep 21600
        done
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  web-dist:
    name: xuri-live-web-dist
  node-modules:
    name: xuri-live-node-modules