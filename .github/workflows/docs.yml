name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify generated reference is current
        run: npm run docs:gen -- --check
      - name: Check docs (frontmatter/paths/links/coverage)
        run: npm run docs:check
      - name: Check module docs were updated (PR only)
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run docs:impact -- --strict
      - name: Build VitePress site
        env:
          DOCS_BASE: /xuri-classroom/
        run: npm run docs:build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

