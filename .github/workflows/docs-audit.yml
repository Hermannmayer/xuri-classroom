name: docs-audit

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit stale module docs
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm run docs:audit | tee docs-audit.txt
      - name: Open or update docs debt issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('docs-audit.txt', 'utf8').slice(0, 60000)
            const title = '[docs] 文档过期'
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`
            const found = await github.rest.search.issuesAndPullRequests({ q })
            const text = `${body}\n\n---\n处理方式：读对应模块页，核对后运行 \`npm run docs:mark -- <module-id>\`，再关闭本 issue。`
            if (found.data.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.data.items[0].number,
                body: text,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: text,
              })
            }

