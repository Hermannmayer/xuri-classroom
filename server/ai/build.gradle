plugins {
    id 'java'
}

version 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

test {
    useJUnitPlatform {
        // 默认跳过 @Tag("slow")：渲染 PDF/Word、起 Spring 上下文、跑 ArchUnit 这类慢用例，
        // 日常 gradle test 只跑业务规则（秒级）；发版/CI 用 -PwithSlow 全跑。
        if (!project.hasProperty("withSlow")) {
            excludeTags "slow"
        }
    }
}
