plugins {
    id 'maven-publish'
}

project.archivesBaseName = 'xuri-classroom'

ext {
    isProd = project.hasProperty("pro")
    isDev = project.hasProperty("dev")
    activeProfile = project.hasProperty("pro") ? "pro" : "dev"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    maven { url 'https://repo.spring.io/snapshot' }
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation project(':rdbms')
    implementation project(':ai')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 集成测试要直接构造 Wrapper 与调用 BaseMapper：mybatis-plus 在 rdbms 的 implementation 里，
    // 不会传递到 api 的 testCompileClasspath，必须显式声明（版本与 rdbms 对齐）。
    testImplementation 'com.baomidou:mybatis-plus-boot-starter:3.5.0'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}

bootJar {
    launchScript()
    enabled = true
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.PropertiesLauncher'
    }
}

processResources {
    // Ant ReplaceTokens 默认用平台编码（Windows=GBK），会把 UTF-8 的 application.yml 中文注释写坏
    filteringCharset = 'UTF-8'
    // exclude resources when build prod
    if (isProd) {
        exclude("application-dev.yml", "generatorConfig.xml")
    }
    // 仅替换 Maven 同样使用的 profile 标记，保留 Spring 环境变量占位符
    filesMatching('application.yml') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [activeProfile: activeProfile])
    }
}
