plugins {
    id 'maven-publish'
}

// Gradle 9 移除了 project.archivesBaseName，改用 base 扩展
base {
    archivesName = 'xuri-classroom'
}

ext {
    isProd = project.hasProperty("pro")
    isDev = project.hasProperty("dev")
    activeProfile = project.hasProperty("pro") ? "pro" : "dev"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    maven { url 'https://repo.spring.io/snapshot' }
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation project(':rdbms')
    implementation project(':ai')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 把 @WebMvcTest / @AutoConfigureMockMvc 拆到 spring-boot-webmvc-test，
    // 包名也从 ...test.autoconfigure.web.servlet 变成 ...webmvc.test.autoconfigure
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	// 1.0.1 的 ASM 读不懂 Java 25 的 class 文件（major 69），会「导入 0 个类 → failed to check any classes」
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    // 集成测试要直接构造 Wrapper 与调用 BaseMapper：mybatis-plus 在 rdbms 的 implementation 里，
    // 不会传递到 api 的 testCompileClasspath，必须显式声明（版本与 rdbms 对齐）。
    testImplementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.18'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}

bootJar {
    // Spring Boot 4 移除了 launchScript()（「完全可执行 jar」特性已删除），
    // 也不再需要手写 Main-Class：PropertiesLauncher 的包名在 Boot 3.2 起搬到了
    // org.springframework.boot.loader.launch，而仓库里没有任何地方用 loader.path /
    // loader.main，所以交给插件用默认的 JarLauncher 最稳。
    // Linux 安装脚本本来就同时接受 PK 与 #! 两种文件头，不受影响。
    enabled = true
}

processResources {
    // Ant ReplaceTokens 默认用平台编码（Windows=GBK），会把 UTF-8 的 application.yml 中文注释写坏
    filteringCharset = 'UTF-8'
    // exclude resources when build prod
    if (isProd) {
        exclude("application-dev.yml", "generatorConfig.xml")
    }
    // 仅替换 Maven 同样使用的 profile 标记，保留 Spring 环境变量占位符
    filesMatching('application.yml') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [activeProfile: activeProfile, projectVersion: project.version.toString()])
    }
}

// 单 jar 内嵌前端：./gradlew :api:bootJar -PwithSpa
// 只有显式传 -PwithSpa 才把 client/dist 打进 BOOT-INF/classes/static；
// Docker 构建仍走独立 nginx，不传这个参数，行为不变。
def spaDir = rootProject.file('../client/dist')
def spaStage = layout.buildDirectory.dir('spa-static')
tasks.register('copySpa', Copy) {
    onlyIf { spaDir.exists() }
    from spaDir
    into spaStage
}
if (project.hasProperty('withSpa')) {
    bootJar {
        dependsOn tasks.named('copySpa')
        from(spaStage) {
            into 'BOOT-INF/classes/static'
        }
    }
}
