version: @projectVersion@
update:

  manifest-url: ${UPDATE_MANIFEST_URL:}

  github-repo: ${UPDATE_GITHUB_REPO:Hermannmayer/xuri-classroom}

  github-api-base: ${UPDATE_GITHUB_API_BASE:https://api.github.com}

  check-interval-hours: ${UPDATE_CHECK_INTERVAL_HOURS:24}
spring:
  application:
    name: survey
  threads:










    virtual:
      enabled: ${SK_VIRTUAL_THREADS:true}
  profiles:
    active: @activeProfile@
  mvc:
    async:
      request-timeout: -1
    static-path-pattern: /notfound
    throw-exception-if-no-handler-found: true


  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
file-storage:



  max-public-file-size-mb: 10
  max-public-uploads-per-minute: 10
  max-public-uploads-per-project-per-minute: 60
  max-project-storage-mb: 1024
  max-total-public-storage-mb: 5120
  max-image-pixels: 16000000
sk:
  audit:



    retention-days: ${SK_AUDIT_RETENTION_DAYS:180}
  web:
    spa:
      enabled: ${SK_WEB_SPA_ENABLED:false}
  schema:


    auto-upgrade: ${SK_SCHEMA_AUTO_UPGRADE:true}
  security:
    url-token-authentication:
      enabled: false
    jwt:



      secret: ${SK_JWT_SECRET:}
      expiration-seconds: 28800
    cors:
      allowed-origin-patterns: []
flowable:
  async-executor-activate: false
  database-schema-update: false

mybatis-plus:

  mapper-locations: classpath*:/mapper/**/*.xml

aj:
  captcha:
    jigsaw: classpath:images/jigsaw
    pic-click: classpath:images/pic-click
    cache-type: local
    cache-number: 1000
    timing-clear: 180
    type: blockPuzzle
    water-mark: ""
    interference-options: 2
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 10
    req-get-minute-limit: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

api:
  prefix: /api

surveyking:
  ai:
    siliconflow:
      enabled: true
      base-url: https://api.siliconflow.cn
      token: ${AI_SILICONFLOW_TOKEN:your_token}
      model-id: deepseek-chat
      model-types:
        - display-name: "DeepSeek Chat"
          value: "deepseek-chat"
          description: "DeepSeek 对话模型"
        - display-name: "Qwen2.5-72B-Instruct"
          value: "Qwen/Qwen2.5-72B-Instruct"
          description: "Qwen2.5 72B 指令模型"
        - display-name: "Llama-3.1-70B-Instruct"
          value: "meta-llama/Meta-Llama-3.1-70B-Instruct"
          description: "Llama 3.1 70B 指令模型"
