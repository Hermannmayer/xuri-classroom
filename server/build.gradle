plugins {
    id 'org.springframework.boot' version '2.7.7'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id "io.spring.javaformat" version "0.0.27"
}

repositories {
	maven { url 'https://repo.spring.io/snapshot' }
	mavenCentral()
}

// 根项目不包含启动类，不生成可执行 Spring Boot 包
bootJar {
    enabled = false
}

// 版本唯一真源：仓库根目录 VERSION（由 scripts/release/release.py 维护）
def appVersionFile = rootProject.file('../VERSION')
if (!appVersionFile.exists()) {
    throw new GradleException('缺少 VERSION 文件：' + appVersionFile)
}
def appVersion = appVersionFile.text.trim()

allprojects {
    group = 'cn.surveyking'
    version = appVersion
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.spring.javaformat'
    // 只有 api 模块负责生成可执行包，其余模块作为普通依赖 jar
    if (name != 'api') {
        bootJar {
            enabled = false
        }
    }
    ext{

    }
    dependencies {
        implementation "org.mapstruct:mapstruct:1.4.2.Final"
        compileOnly "org.projectlombok:lombok"
        annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"
        annotationProcessor "org.mapstruct:mapstruct-processor:1.4.2.Final"
        annotationProcessor "org.projectlombok:lombok"

        implementation ('org.springframework.boot:spring-boot-starter-web') {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
        }
        implementation 'org.springframework.boot:spring-boot-starter-undertow'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        // 3.0 命中 CVE-2025-48924（不受控递归），升级到 3.18.0（API 兼容）
	implementation 'org.apache.commons:commons-lang3:3.18.0'
        implementation 'com.anji-plus:spring-boot-starter-captcha:1.3.0'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
    }
    repositories {
        mavenCentral()
    }

    compileJava {
        options.compilerArgs += [
                '-Amapstruct.suppressGeneratorTimestamp=true',
                '-Amapstruct.suppressGeneratorVersionInfoComment=true',
                '-Amapstruct.verbose=true',
                '-Amapstruct.defaultComponentModel=spring',
                '-Amapstruct.unmappedTargetPolicy=IGNORE'
        ]
    }
}
