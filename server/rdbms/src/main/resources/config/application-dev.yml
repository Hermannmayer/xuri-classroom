# 配置文件不能放在根目录下面，否则会被 api 的 application-dev.yml 覆盖
# 只支持 MySQL 8（H2 已停止支持）。
spring:
  datasource:
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:surveyking}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    call-setters-on-nulls: false
  global-config:
    db-config:
      logic-delete-field: deleted