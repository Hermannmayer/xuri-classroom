# 只支持 MySQL 8（H2 已停止支持）。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      continue-on-error: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    call-setters-on-nulls: false
  global-config:
    db-config:
      logic-delete-field: deleted