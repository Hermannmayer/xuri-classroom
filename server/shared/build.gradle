plugins {
    id 'java'
}

version 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Spring Boot 4 把 spring-boot-starter-aop 改名成 spring-boot-starter-aspectj
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    // 只依赖 core：starter 里的 CaptchaController 是 javax.servlet 写的，在 Jakarta 下必然起不来。
    // core 包（captcha-1.3.0.jar）实测零 servlet 引用，只提供滑块拼图的算法与缓存，
    // HTTP 层由我们自己的 CaptchaController（jakarta）接管，前端契约完全不变。
    implementation 'com.anji-plus:captcha:1.3.0'

    implementation 'org.dhatim:fastexcel:0.12.13'
    // Word 试卷导入：解析 .docx 的段落/表格/图片/公式
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.dhatim:fastexcel-reader:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    // 不再用 jjwt-jackson：它绑死 Jackson 2，而应用侧已是 Jackson 3。
    // JSON 桥由 cn.surveyking.server.core.security.JwtJsonCodec 用 Jackson 3 实现。

    implementation 'com.google.zxing:javase:3.5.4'
    implementation 'net.coobird:thumbnailator:0.4.21'
    // 答卷 PDF 导出（答案 PDF / 成绩册 PDF）：2.0.x 是最后一个兼容 Java 8 的分支，不要升 3.x。
    // 字体见 src/main/resources/fonts/answer-pdf.ttf（霞鹜文楷子集，OFL-1.1）。
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'
    // 题库/试卷富文本：服务端白名单消毒（前端 DOMPurify 只是第一道）
    // 富文本 XSS 的服务端第一道防线，跟着上游升到最新
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20261110.1'
    // 不再显式钉版本：Spring Boot 4 的 BOM 管的是 Caffeine 3.x（Java 11+，本项目已无 8 兼容包袱）
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.belerweb:pinyin4j:2.5.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

test {
    useJUnitPlatform()
}
