# 三个容器：db（MySQL）+ app（后端，内部 7007）+ web（nginx，对外 80）
# 用户只访问 web 的 80 端口；后端端口不对外暴露，换端口也不影响用户。
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-surveyking}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql

      - ./server/rdbms/src/main/resources/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-surveyking}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}



      SK_CRYPTO_KEY: ${SK_CRYPTO_KEY:?Set SK_CRYPTO_KEY to a base64-encoded 32-byte key}


      SK_JWT_SECRET: ${JWT_SECRET:-}
      TZ: Asia/Shanghai

    expose:
      - '7007'
    volumes:

      - app-files:/app/files
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-final
    restart: unless-stopped
    ports:


      - '${APP_PORT:-9527}:80'
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  app-files:
